name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Ruff
        uses: astral-sh/ruff-action@v3

  test:
    name: Unit & Smoke Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system audio/video libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q .

      - name: Run hardware-free unit and smoke tests
        run: python -m unittest discover -s tests -v

  audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          grep -v 'sys_platform == "darwin"' requirements.txt > /tmp/requirements-linux.txt
          pip-audit -r /tmp/requirements-linux.txt
